<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>v13_svr_info.json — просмотр</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }
    .toolbar {
      height: 23px;
      display: flex;
      align-items: center;
      padding: 0 5px;
      background: #3c3c3c;
      border: 1px solid #aaa;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #f1f1f1;
      font-size: 12px;
      font-weight: 700;
      user-select: none;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 13px;
      height: 13px;
      margin: 0;
      accent-color: #eee;
      cursor: pointer;
    }
    .viewer { padding: 12px 5px; }
    pre {
      margin: 0;
      color: #f1f1f1;
      font: 12px/1.2 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .error { color: #ff9a9a; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="auto">Автоформатировать <input id="auto" type="checkbox" /></label>
  </div>
  <main class="viewer"><pre id="output">Загрузка...</pre></main>

  <script>
    (() => {
      const output = document.getElementById('output');
      const auto = document.getElementById('auto');
      let rawText = '';
      let parsed;

      function render() {
        output.classList.remove('error');
        output.textContent = parsed === undefined
          ? rawText
          : (auto.checked ? JSON.stringify(parsed, null, 2) : JSON.stringify(parsed));
      }

      async function load() {
        try {
          const response = await fetch('v13_svr_info.json');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          rawText = await response.text();
          try {
            parsed = JSON.parse(rawText);
          } catch {
            parsed = undefined;
            output.classList.add('error');
          }
          render();
        } catch (error) {
          output.classList.add('error');
          output.textContent = `Ошибка загрузки: ${error.message}`;
        }
      }

      auto.addEventListener('change', render);
      load();
    })();
  </script>
</body>
</html>
